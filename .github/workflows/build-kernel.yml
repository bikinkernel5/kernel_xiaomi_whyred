name: Build Whyred Kernel DRM

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make libc6-dev \
          libncurses5-dev git clang ccache libelf-dev \
          libxml2-utils python3 python3-pip zip curl unzip

    - name: Download Android NDK r25b
      run: |
        mkdir -p toolchain
        cd toolchain
        curl -LO https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip android-ndk-r25b-linux.zip
        mv android-ndk-r25b ndk

    - name: Clone GCC Toolchains (Public ZyCromerZ)
      run: |
        mkdir -p toolchain/gcc
        cd toolchain/gcc
        git clone --depth=1 https://github.com/ZyCromerZ/aarch64-zyc-linux-gnu gcc64
        git clone --depth=1 https://github.com/ZyCromerZ/arm-zyc-linux-gnueabi gcc32

    - name: Build Kernel
      run: |
        # Setup PATH
        export NDK_PATH=$GITHUB_WORKSPACE/toolchain/ndk
        export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export PATH=$GITHUB_WORKSPACE/toolchain/gcc/gcc64/bin:$PATH
        export PATH=$GITHUB_WORKSPACE/toolchain/gcc/gcc32/bin:$PATH

        export ARCH=arm64
        export SUBARCH=arm64

        # Gunakan prefix dari ZyCromerZ toolchain
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-zyc-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-zyc-linux-gnueabi-
        export LLVM=1

        mkdir -p out

        make \
          O=out \
          ARCH=$ARCH \
          SUBARCH=$SUBARCH \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          LLVM=$LLVM \
          whyred_defconfig

        make -j$(nproc) \
          O=out \
          ARCH=$ARCH \
          SUBARCH=$SUBARCH \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          LLVM=$LLVM

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
