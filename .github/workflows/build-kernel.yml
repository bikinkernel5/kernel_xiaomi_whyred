name: Build Whyred Kernel DRM

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make libc6-dev \
          libncurses5-dev git clang ccache libelf-dev \
          libxml2-utils python3 python3-pip zip curl unzip

    - name: Download Android NDK r25b
      run: |
        mkdir -p toolchain
        cd toolchain
        curl -LO https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip android-ndk-r25b-linux.zip
        mv android-ndk-r25b ndk

    - name: Build Kernel
      run: |
        # Setup environment
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$GITHUB_WORKSPACE/toolchain/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CC=clang
        export LLVM=1

        # Target Android API 33 explicitly for Clang
        export KERNEL_TARGET=aarch64-linux-android33
        export KERNEL_TRIPLE=--target=$KERNEL_TARGET

        # Prepare output dir
        mkdir -p out

        # Load defconfig
        make O=out whyred_defconfig

        # Build with --target passed directly to clang
        make -j$(nproc) \
          O=out \
          ARCH=$ARCH \
          SUBARCH=$SUBARCH \
          CC="clang $KERNEL_TRIPLE" \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
          LLVM=$LLVM

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
