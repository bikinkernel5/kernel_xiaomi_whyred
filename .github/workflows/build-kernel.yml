name: Build Whyred Kernel DRM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make \
          libc6-dev libncurses5-dev git clang ccache \
          libelf-dev libxml2-utils python3 python3-pip \
          zip curl unzip xz-utils

    - name: Download Android NDK r25b
      run: |
        mkdir -p toolchain/ndk
        curl -LO https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip -d toolchain/ndk

    - name: Download ARM GNU toolchains
      run: |
        mkdir -p toolchain/gcc
        cd toolchain/gcc
        # AArch64
        curl -LO https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
        tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
        # ARM32
        curl -LO https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz
        tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz

    - name: Apply patched sde_dbg.h
      run: |
        mkdir -p drivers/gpu/drm/msm/
        cat << 'EOF' > drivers/gpu/drm/msm/sde_dbg.h
#ifndef SDE_DBG_H_
#define SDE_DBG_H_

#include <linux/types.h>
#include <linux/printk.h>
#include <linux/io.h>
#include <linux/device.h>
#include <linux/dcache.h>
#include <linux/debugfs.h>

struct sde_dbg_power_ctrl;
struct drm_device;
struct sde_kms;

static inline int sde_dbg_init(struct dentry *debugfs_root, struct device *dev,
                               struct sde_dbg_power_ctrl *power_ctrl)
{
	return 0;
}

static inline void sde_dbg_destroy(void)
{
}

static inline void sde_dbg_dump(bool queue_work, const char *name, ...)
{
}

static inline void sde_dbg_ctrl(const char *name, ...)
{
}

static inline void sde_dbg_init_dbg_buses(u32 hwversion)
{
}

static inline int sde_dbg_reg_register_base(const char *name,
					    void __iomem *base,
					    size_t length)
{
	return 0;
}

static inline void sde_dbg_reg_register_dump_range(const char *base_name,
						    const char *range_name,
						    u32 start_offset,
						    u32 end_offset,
						    uint32_t blk)
{
}

static inline void sde_dbg_set_sde_top_offset(u32 blk_off)
{
}

static inline void sde_evtlog_log(void *evtlog, const char *func, const char *fmt, ...)
{
}

#define SDE_EVT32(args...)        sde_evtlog_log(NULL, __func__, ##args)
#define SDE_EVT32_VERBOSE(args...) SDE_EVT32(args)
#define SDE_DBG_EVTLOG(args...)   SDE_EVT32(args)

#endif /* SDE_DBG_H_ */
EOF

    - name: Build Kernel
      run: |
        export NDK=$GITHUB_WORKSPACE/toolchain/ndk/android-ndk-r25b
        export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PWD/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin:$PWD/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-linux-gnueabihf/bin:$PATH"

        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-none-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-none-linux-gnueabihf-
        export LLVM=1

        mkdir -p out
        make O=out whyred_defconfig
        make -j$(nproc) O=out \
          ARCH=$ARCH SUBARCH=$SUBARCH \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          LLVM=$LLVM

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
