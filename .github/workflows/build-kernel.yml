name: Build Whyred Kernel DRM

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make libc6-dev \
          libncurses5-dev git clang ccache libelf-dev \
          libxml2-utils python3 python3-pip zip curl

    - name: Clone Proton-Clang Toolchain
      run: |
        mkdir -p toolchain
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang

    - name: Set Environment Variables
      run: |
        echo "PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        mkdir -p out
        make O=out whyred_defconfig

        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=$CROSS_COMPILE \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          LLVM=1

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
